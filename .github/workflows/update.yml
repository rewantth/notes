name: Update dashboard

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub often starts runs a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      test_alert:
        description: "Also send a test phone alert (needs the NTFY_TOPIC secret)"
        type: boolean
        default: false
  push:
    branches: [main]

# Nothing is allowed by default. Each job below asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      # Every action is pinned to an exact commit, not a moving tag, so a hijacked tag upstream
      # cannot run new code next to your Gmail secrets. Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check that the secrets are set
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: |
          missing=0
          for name in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN DASHBOARD_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set. See the Setup section of the README."
              missing=1
            fi
          done
          exit $missing
      - name: Read Gmail and build encrypted data
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}          # optional: turns on phone alerts
          ALERT_TEST: ${{ inputs.test_alert }}
        run: python build_data.py
      - name: Add the security policy to the pages
        run: python build_site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
